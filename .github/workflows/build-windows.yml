name: Build Windows Installer

on:
  push:
    tags:
      - 'v1.*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify VERSION matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$tag" != "$version" ]; then
            echo "ERROR: VERSION file ($version) does not match tag ($tag). Update VERSION before tagging." >&2
            exit 1
          fi
          echo "OK: VERSION $version matches tag $tag"

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "NSIS installed"

      - name: Build installer
        working-directory: installer
        run: |
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/NSIS/makensis.exe" -V3 Kivun_Terminal_Setup.nsi
          if [ ! -f Kivun_Terminal_Setup.exe ]; then
            echo "ERROR: makensis did not produce Kivun_Terminal_Setup.exe" >&2
            exit 1
          fi
          size_kb=$(( $(stat -c%s Kivun_Terminal_Setup.exe) / 1024 ))
          echo "Built Kivun_Terminal_Setup.exe (${size_kb} KB)"

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kivun_Terminal_Setup
          path: installer/Kivun_Terminal_Setup.exe
          if-no-files-found: error

      # Every release MUST carry the demo video + GIF so a first-time visitor
      # landing on the latest release sees it — never buried in an old release.
      # Build FAILS if the media is missing from the repo.
      - name: Stage installer + demo media (video is mandatory)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-assets
          cp installer/Kivun_Terminal_Setup.exe release-assets/
          missing=0
          if [ -f "Kivun Terminal_v1.4.13.mp4" ]; then
            cp "Kivun Terminal_v1.4.13.mp4" "release-assets/Kivun_Terminal_v1.4.13.mp4"
          else
            echo "::error::Demo MP4 missing from repo — every release must include the demo video."; missing=1
          fi
          if [ -f "Kivun_Terminal_v1.4.13.gif" ]; then
            cp "Kivun_Terminal_v1.4.13.gif" "release-assets/Kivun_Terminal_v1.4.13.gif"
          else
            echo "::error::Demo GIF missing from repo — every release must include the demo GIF."; missing=1
          fi
          [ "$missing" = "1" ] && exit 1
          ls -la release-assets

      # Welcoming, non-technical notes: the template (demo GIF + plain install
      # steps + first-timer help) is REQUIRED, then we append the plain-English
      # "what's new" (docs/RELEASE_NOTES_<ver>.md if present, else the CHANGELOG).
      - name: Build welcoming release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [ ! -f .github/RELEASE_TEMPLATE.md ]; then
            echo "::error::.github/RELEASE_TEMPLATE.md missing — release notes must be welcoming to first-time visitors."; exit 1
          fi
          sed "s/TAG_PLACEHOLDER/${TAG}/g" .github/RELEASE_TEMPLATE.md > /tmp/release-notes.md
          printf '\n## What'"'"'s new in %s\n\n' "$TAG" >> /tmp/release-notes.md
          NOTES_FILE="docs/RELEASE_NOTES_${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            cat "$NOTES_FILE" >> /tmp/release-notes.md
          else
            awk -v ver="$VERSION" '
              $0 ~ "^## \["ver"\]" { in_section = 1; next }
              /^## \[/ { if (in_section) exit }
              in_section { print }
            ' docs/CHANGELOG.md >> /tmp/release-notes.md
          fi
          echo "----- /tmp/release-notes.md -----"; cat /tmp/release-notes.md; echo "----- end -----"

      - name: Attach installer + demo video to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Kivun_Terminal_Setup.exe
            release-assets/Kivun_Terminal_v1.4.13.mp4
            release-assets/Kivun_Terminal_v1.4.13.gif
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
